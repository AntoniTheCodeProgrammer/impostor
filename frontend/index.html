<!DOCTYPE html>
<html lang="pl" data-theme="impostor">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impostor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="theme.css">
    <link rel="icon" href="icon.png">
</head>

<body class="min-h-dvh bg-base-200">

    <!-- ══ WIDOK LOGOWANIA ══ -->
    <main id="login-view" class="app-hero min-h-dvh flex items-center justify-center p-4">
        <div class="card w-full max-w-sm bg-base-100 shadow-2xl">
            <div class="card-body items-center text-center gap-4">
                <img src="icon.png" alt="Logo Impostor" class="w-40 h-40 object-contain">
                <h1 class="text-3xl font-black tracking-tight">Impostor</h1>
                <form id="login-form" class="w-full flex flex-col gap-3">
                    <input id="username" type="text" class="input w-full" placeholder="Nazwa użytkownika" required>
                    <input id="password" type="password" class="input w-full" placeholder="Hasło" required>
                    <p id="error-msg" class="alert alert-error text-sm py-2" hidden></p>
                    <button id="login-btn" type="submit" class="btn btn-primary w-full">Start</button>
                </form>
            </div>
        </div>
    </main>

    <!-- ══ WIDOK PO ZALOGOWANIU ══ -->
    <main id="logged-view" class="min-h-dvh p-4 sm:p-8" hidden>
        <div class="mx-auto max-w-xl">
            <header class="flex items-start justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-5xl sm:text-6xl font-black tracking-tighter text-primary leading-none">Impostor</h1>
                    <p id="greeting" class="text-base-content/70 mt-2"></p>
                </div>
                <button id="logout-btn" class="btn btn-outline btn-circle shrink-0" type="button" title="Wyloguj" aria-label="Wyloguj">
                    <svg xmlns="http://www.w3.org/2000/svg" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </header>

            <section class="card bg-base-100 shadow-md mb-6" aria-labelledby="role-heading">
                <div class="card-body">
                    <h2 id="role-heading" class="section-label mb-1">Twoja rola</h2>
                    <strong id="role-display" class="text-3xl font-bold text-secondary"></strong>
                    <p id="role-unknown" class="opacity-70">Rola nie została jeszcze przydzielona</p>
                    <div class="card-actions">
                        <button id="toggle-role-btn" class="btn btn-outline btn-sm" type="button" hidden>Pokaż rolę</button>
                    </div>
                </div>
            </section>

            <div class="mb-6">
                <div class="flex items-start gap-2 flex-wrap">
                    <form id="message-form" class="flex gap-2 flex-wrap">
                        <input id="message-input" class="input w-48" type="text" maxlength="20" placeholder="Wiadomość do admina" aria-label="Wiadomość do admina (maksymalnie 20 znaków)" required>
                        <button id="message-btn" class="btn btn-outline" type="submit">Wyślij</button>
                    </form>
                    <button id="ping-btn" class="btn btn-primary px-8" type="button">Ping</button>
                </div>
                <p id="ping-msg" class="text-sm opacity-70 mt-2 min-h-5" role="status"></p>
                <p id="message-msg" class="text-sm opacity-70 min-h-5" role="status"></p>
            </div>

            <section id="task-section" class="mb-6" aria-labelledby="task-heading" hidden>
                <h2 id="task-heading" class="section-label">Zadanie</h2>
                <div id="task-box" class="card bg-base-100 shadow-md" hidden>
                    <div class="card-body">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span id="task-title" class="text-lg font-bold"></span>
                            <span id="task-group-badge" class="badge badge-secondary"></span>
                        </div>
                        <p id="task-description" class="text-sm opacity-70"></p>
                    </div>
                </div>
            </section>

            <section id="challenge-section" class="mb-6" aria-labelledby="challenge-heading" hidden>
                <h2 id="challenge-heading" class="section-label">Wyzwanie</h2>
                <div id="challenge-box" class="card bg-base-100 shadow-md" hidden>
                    <div class="card-body">
                        <h3 id="challenge-title" class="text-lg font-bold"></h3>
                        <p id="challenge-description" class="text-sm opacity-70"></p>
                    </div>
                </div>
            </section>

            <section id="rewards-section" class="mb-6" aria-labelledby="rewards-heading" hidden>
                <h2 id="rewards-heading" class="section-label">Nagrody</h2>
                <div id="rewards-list" class="flex flex-col gap-3"></div>
            </section>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const API = window.API_URL;
        let ws = null;
        let heartbeat = null;
        let reconnectTimer = null;
        let reconnectDelay = 1000;
        let lastPong = 0;
        let roleIsVisible = false;

        // Dane w localStorage służą tylko do szybkiego pierwszego wyświetlenia –
        // źródłem prawdy jest serwer (GET /me), synchronizowany przy każdym (re)connect.
        function getToken() { return localStorage.getItem("token"); }
        function getUser() { return getToken() ? localStorage.getItem("username") : null; }
        function setSession(username, token) {
            localStorage.setItem("username", username);
            localStorage.setItem("token", token);
        }
        function clearUser() {
            for (const key of ["username", "token", "role", "task", "challenge", "rewards"]) {
                localStorage.removeItem(key);
            }
            roleIsVisible = false;
            document.getElementById("message-input").value = "";
            document.getElementById("message-msg").textContent = "";
        }
        function getRole() { return localStorage.getItem("role"); }
        function setRole(r) {
            if (getRole() !== r) roleIsVisible = false;
            localStorage.setItem("role", r);
            updateRoleDisplay();
        }
        function getTask() { const t = localStorage.getItem("task"); return t ? JSON.parse(t) : null; }
        function setTask(t) { localStorage.setItem("task", JSON.stringify(t)); }
        function getChallenge() { const c = localStorage.getItem("challenge"); return c ? JSON.parse(c) : null; }
        function setChallenge(c) { localStorage.setItem("challenge", JSON.stringify(c)); }
        function getRewards() { const r = localStorage.getItem("rewards"); return r ? JSON.parse(r) : []; }
        function setRewards(r) { localStorage.setItem("rewards", JSON.stringify(r)); }

        // Zapytanie z tokenem sesji; 401 oznacza wygasłą sesję lub usunięte konto.
        async function apiFetch(path, options = {}) {
            const res = await fetch(`${API}${path}`, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${getToken()}`,
                    ...(options.headers || {}),
                },
            });
            if (res.status === 401) endSession("Sesja wygasła – zaloguj się ponownie");
            return res;
        }

        function endSession(message) {
            stopConnection();
            clearUser();
            render();
            if (message) {
                const errEl = document.getElementById("error-msg");
                errEl.textContent = message;
                errEl.hidden = false;
            }
        }

        function applyState(state) {
            if (state.role) setRole(state.role); else localStorage.removeItem("role");
            if (state.task) setTask(state.task); else localStorage.removeItem("task");
            if (state.challenge) setChallenge(state.challenge); else localStorage.removeItem("challenge");
            setRewards(state.rewards || []);
            updateRoleDisplay();
            showTask(getTask());
            showChallenge(getChallenge());
            showRewards();
        }

        async function syncState() {
            try {
                const res = await apiFetch("/me");
                if (res.ok) applyState(await res.json());
            } catch { /* brak sieci – spróbujemy przy następnym połączeniu */ }
        }

        function updateRoleDisplay() {
            const role = getRole();
            const roleDisplay = document.getElementById("role-display");
            const roleUnknown = document.getElementById("role-unknown");
            const toggleRoleButton = document.getElementById("toggle-role-btn");

            roleDisplay.textContent = roleIsVisible ? role : "••••••";
            roleDisplay.hidden = !role;
            roleUnknown.hidden = Boolean(role);
            toggleRoleButton.hidden = !role;
            toggleRoleButton.textContent = roleIsVisible ? "Ukryj rolę" : "Pokaż rolę";
        }

        function showTask(task) {
            const box = document.getElementById("task-box");
            const section = document.getElementById("task-section");
            if (!task) {
                box.hidden = true;
                section.hidden = true;
                return;
            }

            section.hidden = false;
            document.getElementById("task-title").textContent = task.title || task.quest_title || "";
            document.getElementById("task-description").textContent = task.description || task.quest_description || "";

            const group = task.group ?? task.group_num ?? null;
            const badge = document.getElementById("task-group-badge");
            badge.hidden = !group;
            if (group) badge.textContent = "gr. " + group;

            box.hidden = false;
        }

        function showChallenge(c) {
            const box = document.getElementById("challenge-box");
            const section = document.getElementById("challenge-section");
            if (!c) {
                box.hidden = true;
                section.hidden = true;
                return;
            }

            section.hidden = false;
            document.getElementById("challenge-title").textContent = c.title || "";
            document.getElementById("challenge-description").textContent = c.description || "";

            box.hidden = false;
        }

        function showRewards() {
            const rewards = getRewards();
            const section = document.getElementById("rewards-section");
            const list = document.getElementById("rewards-list");
            list.replaceChildren();
            section.hidden = rewards.length === 0;

            for (const reward of rewards) {
                const card = document.createElement("div");
                card.className = "card bg-base-100 shadow-md";

                const body = document.createElement("div");
                body.className = "card-body flex-row items-center justify-between gap-3 p-4";

                const text = document.createElement("div");
                const title = document.createElement("div");
                title.className = "font-bold";
                title.textContent = reward.reward || "";
                const description = document.createElement("div");
                description.className = "text-sm opacity-70";
                description.textContent = reward.description || "";
                description.hidden = !reward.description;
                text.append(title, description);

                const button = document.createElement("button");
                button.type = "button";
                button.className = "btn btn-secondary btn-sm shrink-0";
                button.textContent = "Użyj";
                button.addEventListener("click", () => useReward(reward, button));

                body.append(text, button);
                card.appendChild(body);
                list.appendChild(card);
            }
        }

        async function useReward(reward, button) {
            if (!confirm(`Użyć nagrody "${reward.reward}"? Nagroda zniknie z listy.`)) return;
            button.disabled = true;
            try {
                const res = await apiFetch(`/rewards/${reward.id}/use`, { method: "POST" });
                if (res.status === 401) return;
                // 404 oznacza, że nagroda została już użyta – również usuwamy ją z listy
                if (!res.ok && res.status !== 404) {
                    alert("Nie udało się użyć nagrody.");
                    button.disabled = false;
                    return;
                }
                setRewards(getRewards().filter(r => r.id !== reward.id));
                showRewards();
            } catch {
                alert("Nie można połączyć z serwerem");
                button.disabled = false;
            }
        }

        function stopConnection() {
            clearTimeout(reconnectTimer);
            clearInterval(heartbeat);
            if (ws) { ws.onclose = null; ws.close(); ws = null; }
        }

        function handleMessage(msg) {
            if (msg.type === "kicked") {
                endSession();
                alert("Twoje konto zostało usunięte przez admina.");
            } else if (msg.type === "role") {
                setRole(msg.role);
            } else if (msg.type === "task") {
                setTask(msg);
                showTask(msg);
            } else if (msg.type === "challenge") {
                setChallenge(msg.challenge);
                showChallenge(msg.challenge);
            } else if (msg.type === "challenge_removed") {
                localStorage.removeItem("challenge");
                showChallenge(null);
            } else if (msg.type === "reward") {
                const rewards = getRewards().filter(r => r.id !== msg.reward.id);
                rewards.push(msg.reward);
                setRewards(rewards);
                showRewards();
            }
        }

        // Połączenie jest odnawiane automatycznie (blokada telefonu, restart serwera,
        // zmiana sieci), a po każdym połączeniu stan jest pobierany z serwera.
        function connectWebSocket() {
            stopConnection();
            const token = getToken();
            if (!token) return;

            const socket = new WebSocket(`${window.WS_URL}/ws?token=${encodeURIComponent(token)}`);
            ws = socket;

            socket.onopen = () => {
                reconnectDelay = 1000;
                lastPong = Date.now();
                syncState();
                heartbeat = setInterval(() => {
                    // Brak odpowiedzi serwera = martwe połączenie, którego przeglądarka jeszcze nie zauważyła
                    if (Date.now() - lastPong > 50000) { connectWebSocket(); return; }
                    if (socket.readyState === WebSocket.OPEN) socket.send("ping");
                }, 20000);
            };

            socket.onmessage = (event) => {
                lastPong = Date.now();
                let msg;
                try { msg = JSON.parse(event.data); } catch { return; }
                handleMessage(msg);
            };

            socket.onclose = (event) => {
                if (ws !== socket) return;
                ws = null;
                clearInterval(heartbeat);
                if (event.code === 4401) {
                    endSession("Sesja wygasła – zaloguj się ponownie");
                    return;
                }
                reconnectTimer = setTimeout(connectWebSocket, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 2, 15000);
            };
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden || !getUser()) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) connectWebSocket();
            else syncState();
        });
        window.addEventListener("online", () => { if (getUser()) connectWebSocket(); });

        function render() {
            const user = getUser();
            if (user) {
                document.getElementById("login-view").hidden = true;
                document.getElementById("logged-view").hidden = false;
                document.getElementById("greeting").textContent = `Cześć, ${user}!`;
                updateRoleDisplay();
                showTask(getTask());
                showChallenge(getChallenge());
                showRewards();
                connectWebSocket();
            } else {
                document.getElementById("login-view").hidden = false;
                document.getElementById("logged-view").hidden = true;
            }
        }

        // Formularz (zamiast kliknięcia przycisku) – działa też po naciśnięciu Enter
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const errEl = document.getElementById("error-msg");
            errEl.hidden = true;

            if (!username || !password) {
                errEl.textContent = "Uzupełnij wszystkie pola";
                errEl.hidden = false;
                return;
            }

            try {
                const res = await fetch(`${API}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });

                if (!res.ok) {
                    const { detail } = await res.json().catch(() => ({}));
                    errEl.textContent = typeof detail === "string" ? detail : "Błąd logowania";
                    errEl.hidden = false;
                    return;
                }

                const data = await res.json();
                setSession(data.username, data.token);
                applyState(data);
                render();
            } catch {
                errEl.textContent = "Nie można połączyć z serwerem";
                errEl.hidden = false;
            }
        });

        document.getElementById("logout-btn").addEventListener("click", () => endSession());

        document.getElementById("toggle-role-btn").addEventListener("click", () => {
            roleIsVisible = !roleIsVisible;
            updateRoleDisplay();
        });

        document.getElementById("ping-btn").addEventListener("click", async () => {
            const button = document.getElementById("ping-btn");
            const msg = document.getElementById("ping-msg");
            button.disabled = true;
            try {
                const res = await apiFetch("/ping", { method: "POST" });
                msg.textContent = res.ok ? "Ping wysłany ✓" : "Nie udało się wysłać pinga";
            } catch {
                msg.textContent = "Nie można połączyć z serwerem";
            }
            // blokada chroni logi przed przypadkowym spamem
            setTimeout(() => {
                button.disabled = false;
                msg.textContent = "";
            }, 3000);
        });

        document.getElementById("message-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("message-input");
            const button = document.getElementById("message-btn");
            const status = document.getElementById("message-msg");
            const message = input.value.trim();
            if (!message) {
                status.textContent = "Wpisz wiadomość";
                return;
            }
            button.disabled = true;
            try {
                const res = await apiFetch("/message", {
                    method: "POST",
                    body: JSON.stringify({ message }),
                });
                if (!res.ok) {
                    const data = await res.json();
                    status.textContent = typeof data.detail === "string" ? data.detail : "Nie udało się wysłać wiadomości";
                    return;
                }
                if (input.value.trim() === message) input.value = "";
                status.textContent = "Wiadomość wysłana ✓";
            } catch {
                status.textContent = "Nie można połączyć z serwerem";
            } finally {
                button.disabled = false;
            }
        });

        render();
    </script>
</body>

</html>
